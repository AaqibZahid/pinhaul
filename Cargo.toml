[package]
name = "pinpull"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = { version = "0.8", default-features = false }
anyhow = "1.0.104"
base64 = "0.23.1"
cbc = "0.1"
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5.8"
