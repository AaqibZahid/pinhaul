<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinpull</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="../icons/48.png" alt="" aria-hidden="true" />
          <div>
            <p class="eyebrow">Pinterest archive</p>
            <h1>Pinpull</h1>
          </div>
        </div>
        <button id="refresh" class="icon-button" type="button" title="Refresh boards" aria-label="Refresh boards">↻</button>
      </header>

      <p class="tagline">Save the whole board.<br /><em>Keep every section.</em></p>

      <section class="intro">
        <div class="account-state">
          <span class="status-dot" aria-hidden="true"></span>
          <strong id="account">Your boards</strong>
          <p id="message" class="message hidden"></p>
        </div>
        <button id="connect" class="link-button hidden" type="button">Open Pinterest</button>
      </section>

      <label class="toggle">
        <input id="save-as" type="checkbox" />
        <span>Ask where to save the ZIP</span>
      </label>

      <section id="queue-actions" class="queue-actions hidden" aria-live="polite">
        <span id="selected-count">0 boards selected</span>
        <div>
          <button id="clear-selected" class="link-button" type="button">Clear</button>
          <button id="download-selected" class="secondary" type="button">Download selected</button>
        </div>
      </section>

      <section id="downloads" class="downloads" aria-live="polite"></section>

      <section id="boards" class="boards" aria-live="polite">
        <div class="list-heading"><span>Your collection</span><span>Choose one or many</span></div>
        <div id="board-list" class="board-list"></div>
        <p id="empty" class="empty hidden">No boards found. Sign in to Pinterest, then refresh.</p>
      </section>

      <section class="manual">
        <div>
          <p class="section-title">Another public board</p>
          <p class="section-copy">Paste a Pinterest link or board name.</p>
        </div>
        <form id="manual-form" autocomplete="off">
          <input id="board-input" type="text" placeholder="username/boardname or Pinterest URL" spellcheck="false" />
          <button id="manual-download" class="secondary" type="submit">Download</button>
        </form>
      </section>

      <template id="progress-template">
        <article class="progress">
          <div class="progress-heading">
            <div class="spinner" aria-hidden="true"></div>
            <div>
              <strong class="phase">Starting</strong>
              <p class="progress-board"></p>
              <p class="detail">Preparing download</p>
            </div>
          </div>
          <div class="bar"><div class="bar-fill"></div></div>
          <div class="stats"><span class="progress-stats">0 pins · 0 files</span><button class="cancel" type="button">Stop</button></div>
        </article>
      </template>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
